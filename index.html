<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warba Attendance System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: #f3f4f6; min-height: 100vh; }
  .topbar { background: #0b2d52; padding: 14px 28px; display: flex; align-items: center; gap: 16px; }
  .topbar-sub { color: #cfa445; font-size: 12px; font-weight: 600; letter-spacing: 0.6px; }
  .content { display: flex; flex-direction: column; align-items: center; padding: 36px 20px 20px; }
  .toggle { display: flex; background: #e5e7eb; border-radius: 24px; padding: 4px; margin-bottom: 26px; }
  .toggle button { border: none; background: transparent; padding: 9px 22px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; color: #6b7280; transition: all 0.15s ease; }
  .toggle button.active.checkin { background: #dcfce7; color: #15803d; }
  .toggle button.active.checkout { background: #fee2e2; color: #b91c1c; }
  .card { background: #fff; border-radius: 16px; max-width: 420px; width: 100%; padding: 36px 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; color: #0b2d52; margin-bottom: 4px; }
  .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 22px; }
  .time-row { background: #f3f4f6; border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #6b7280; margin-bottom: 22px; }
  .time-row strong { color: #0b2d52; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin: 16px 0 6px; }
  input[type="text"], textarea { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; outline: none; }
  input:focus, textarea:focus { border-color: #0b2d52; }
  .status-banner { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13px; display: none; }
  .status-banner.ok { background: #dcfce7; color: #15803d; display: block; }
  .status-banner.blocked { background: #fee2e2; color: #b91c1c; display: block; }
  .status-banner.checking { background: #f3f4f6; color: #6b7280; display: block; }
  button.submit { width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; }
  button.submit.checkin { background: #15803d; }
  button.submit.checkout { background: #b91c1c; }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 18px; padding: 14px; border-radius: 10px; font-size: 14px; text-align: center; display: none; }
  .msg.error { background: #fee2e2; color: #b91c1c; display: block; }
  .result { display: none; text-align: center; }
  .result.show { display: block; }
  .result .icon { width: 64px; height: 64px; border-radius: 50%; background: #dcfce7; color: #15803d; font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .result.error .icon { background: #fee2e2; color: #b91c1c; }
  .result .name { font-size: 20px; font-weight: 700; color: #15803d; margin-bottom: 4px; }
  .result.error .name { color: #b91c1c; }
  .again { background: #0b2d52; color: #fff; border: none; padding: 12px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="topbar"><div class="topbar-sub">ATTENDANCE MANAGEMENT SYSTEM</div></div>
  <div class="content">
    <div class="toggle">
      <button id="tabCheckin" class="active checkin" onclick="setMode('checkin')" type="button">CHECK-IN</button>
      <button id="tabCheckout" class="checkout" onclick="setMode('checkout')" type="button">CHECK-OUT</button>
    </div>
    <div class="card">
      <div id="formView">
        <h1 id="formTitle">Student Check-In</h1>
        <p class="subtitle" id="formSubtitle">Enter your registered mobile number.</p>
        <div class="time-row">Current Time: <strong id="clock"></strong></div>
        <form id="attendanceForm" target="hiddenUploadFrame" method="POST" enctype="multipart/form-data" onsubmit="return false;">
          <input type="hidden" name="mode" id="formMode" value="checkin">
          <input type="hidden" name="requestId" id="formRequestId" value="">
          <label for="mobile">Mobile Number</label>
          <input type="text" id="mobile" name="mobile" placeholder="+965XXXXXXXX" oninput="onMobileChanged()">
          <div id="statusBanner" class="status-banner"></div>
          <div id="checkoutFields" style="display:none;">
            <label for="feedback">Feedback</label>
            <textarea id="feedback" name="feedback"></textarea>
            <label for="videoFile">Upload Photos (optional)</label>
            <input type="file" id="videoFile" accept="image/*,video/*" multiple>
          </div>
          <button id="submitBtn" type="button" class="submit checkin" onclick="submitForm()" disabled>Enter mobile number</button>
          <div id="msg" class="msg"></div>
        </form>
      </div>
      <div id="resultView" class="result">
        <div class="icon" id="resultIcon">&#10003;</div>
        <div class="name" id="resultName"></div>
        <div id="resultHeadline" style="font-weight:700; color:#0b2d52; margin-bottom:8px;"></div>
        <div id="resultDetail" style="font-size:14px; color:#6b7280; margin-bottom:24px;"></div>
        <button class="again" onclick="resetView()" type="button">Done</button>
      </div>
    </div>
  </div>
  <iframe name="hiddenUploadFrame" style="display:none;"></iframe>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOQWers9KekqFKAPjiBDu1eNHyAK5S1s58w8nnf1jrzXMS3PuvXq5ofv8BFyzZS58hFA/exec';
  let mode = 'checkin';
  let statusDebounce = null;
  let lastStatus = null;

  function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }
  setInterval(updateClock, 1000);

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('formMode').value = mode;
    document.getElementById('tabCheckin').classList.toggle('active', mode === 'checkin');
    document.getElementById('tabCheckout').classList.toggle('active', mode === 'checkout');
    document.getElementById('checkoutFields').style.display = (mode === 'checkout') ? 'block' : 'none';
    document.getElementById('submitBtn').className = 'submit ' + mode;
    resetView();
    onMobileChanged();
  }

  function setBanner(text, kind) {
    const banner = document.getElementById('statusBanner');
    if (!text) { banner.style.display = 'none'; return; }
    banner.textContent = text; banner.className = 'status-banner ' + kind;
  }

  function setSubmitState(enabled, label) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = !enabled; btn.textContent = label;
  }

  // DEBOUNCED FUNCTION: Prevents lag by waiting 600ms
  function onMobileChanged() {
    const mobile = document.getElementById('mobile').value.trim();
    clearTimeout(statusDebounce);
    if (mobile.length < 4) { setBanner('', ''); setSubmitState(false, 'Enter mobile number'); return; }
    
    setBanner('Checking status...', 'checking');
    statusDebounce = setTimeout(() => {
      const cb = 'cb_' + Date.now();
      jsonp(APPS_SCRIPT_URL + '?mode=status&mobile=' + encodeURIComponent(mobile), cb)
        .then(applyStatus);
    }, 600);
  }

  function applyStatus(data) {
    lastStatus = data;
    if (!data.success) { setBanner(data.message, 'blocked'); setSubmitState(false, 'Invalid'); return; }
    if (data.windowBlocked) { setBanner(data.windowMessage, 'blocked'); setSubmitState(false, 'Not Available'); return; }
    
    const canSubmit = (mode === 'checkin') ? (data.state === 'not_checked_in') : (data.state === 'checked_in');
    setBanner(canSubmit ? '' : (mode === 'checkin' ? 'Already checked in' : 'Must check in first'), canSubmit ? '' : 'blocked');
    setSubmitState(canSubmit, mode === 'checkin' ? 'Check In' : 'Check Out');
  }

  function jsonp(url, callbackName) {
    return new Promise((resolve) => {
      const script = document.createElement('script');
      window[callbackName] = (data) => { resolve(data); script.remove(); };
      script.src = url + '&callback=' + callbackName;
      document.body.appendChild(script);
    });
  }

  function submitForm() {
    if (mode === 'checkin') {
      const cb = 'cb_' + Date.now();
      jsonp(APPS_SCRIPT_URL + '?mode=checkin&mobile=' + encodeURIComponent(document.getElementById('mobile').value), cb)
        .then(showResult);
    } else {
      document.getElementById('attendanceForm').submit();
      // Logic for checkout continues via your existing poll mechanism
    }
  }

  function showResult(data) {
    document.getElementById('formView').style.display = 'none';
    const resultView = document.getElementById('resultView');
    resultView.classList.add('show');
    document.getElementById('resultName').textContent = data.name;
    document.getElementById('resultHeadline').textContent = data.success ? 'Success' : 'Error';
    document.getElementById('resultDetail').textContent = data.message;
  }

  function resetView() {
    document.getElementById('formView').style.display = 'block';
    document.getElementById('resultView').classList.remove('show');
  }
</script>
</body>
</html>
